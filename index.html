<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moses Alfonso — The CommDesk Commission</title>
<meta name="description" content="Portfolio of Moses Alfonso — videography, photography, 3D animation, and graphic design. The CommDesk Commission.">
<style>
  :root{
    --bg:#0c0c10;
    --ink:#f5f3ee;
    --muted:#b9b9c2;
    --teal:#4fd1c5;
    --gold:#f2c94c;
    --panel:rgba(12,12,16,0.72);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
  }

  /* ---------- POSTER ---------- */
  .poster-wrap{
    position:relative;
    width:100%;
    line-height:0;
  }
  .poster{
    display:block;
    width:100%;
    height:auto;
  }

  /* ---------- FLOATING CTA ---------- */
  .cta{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:10;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 22px;
    background:var(--panel);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:999px;
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    opacity:0;
    transform:translateY(12px);
    animation:rise 0.6s ease-out 0.4s forwards;
    transition:border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  .cta:hover,
  .cta:focus-visible{
    border-color:var(--teal);
    transform:translateY(-2px);
    background:rgba(12,12,16,0.9);
  }
  .cta:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:3px;
  }
  .cta .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--gold);
    flex:none;
  }
  .cta .arrow{
    transition:transform 0.2s ease;
  }
  .cta:hover .arrow{
    transform:translateX(3px);
  }

  @keyframes rise{
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .cta{animation:none; opacity:1; transform:none;}
    .cta .arrow, .cta{transition:none;}
    html{scroll-behavior:auto;}
  }

  @media (max-width:640px){
    .cta{
      right:16px;
      bottom:16px;
      padding:12px 18px;
      font-size:12.5px;
    }
  }

  /* ---------- SKIP LINK (a11y) ---------- */
  .skip-link{
    position:absolute;
    left:-999px;
    top:0;
    background:var(--ink);
    color:var(--bg);
    padding:10px 16px;
    z-index:100;
    border-radius:6px;
    text-decoration:none;
    font-size:14px;
  }
  .skip-link:focus{
    left:16px;
    top:16px;
  }
</style>
</head>
<body>

  <a class="skip-link" href="#rate-card-link">Skip to rate card link</a>

  <main class="poster-wrap">
    <img
      class="poster"
      src="portfolio-poster.png"
      alt="Moses Alfonso portfolio poster. The CommDesk Commission logo mark at top. Categories: videography, photography, 3D animation, graphic designer. Right side, portrait of Moses holding a camera. Bottom panel lists Experience: ITSC Media Director 2025-2026, ITSC MMT Video Editor 2024-2025, Freelancing 2022. Achievements: To Die A Second Time, 2nd place Sine CLSU Colors of Love 2026, video editor; Pamanang Tumana, 1st place Advocacy Video ASEAN Future Sustainable Leaders Competition 2025, videographer; IRCITE 2025 VE 3rd place, video editor; IRCITE 2024 VE Champion, video editor. Software: Photoshop, Capcut, Blender, Premiere Pro, DaVinci Resolve."
    >
  </main>

  <a id="rate-card-link" class="cta" href="rate_card.html">
    <span class="dot" aria-hidden="true"></span>
    View rate card
    <span class="arrow" aria-hidden="true">→</span>
  </a>

  <script>
    // Reveal the CTA only once the poster image has actually finished loading,
    // so it never appears floating over a blank page on a slow connection.
    var poster = document.querySelector('.poster');
    var cta = document.querySelector('.cta');
    function showCta(){
      cta.style.animationPlayState = 'running';
    }
    if (poster.complete) {
      showCta();
    } else {
      poster.addEventListener('load', showCta);
      poster.addEventListener('error', showCta);
    }
  </script>

</body>
</html>
